<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Mini Splitter</title>
</head>
<body>
    <div class="app-home">

        <!-- 🔝 Navbar -->
        <nav class="home-navbar">
            <div class="left-nav-item">
                <h2 class="logo"><a href="Home.html">Expense Splitter</a></h2>
            </div>
            

            <div class="right-nav-item">
                <div class="login-btn">
                    <a href="login.html" class="btn">Log in</a>
                </div>


                <div class="signup-btn">
                    <a href="signup.html" class="btn">Sign up</a>
                </div>
            </div>

        </nav>
   
    
        <div class="logs-container">

            <div class="signup-card">
                <h3 class="log-header">Sign Up</h3>

                <div class="field">
                    <label for="">Full Name</label>
                    <input type="text" name="fullname" id="fullName" placeholder="full name" />
                </div>

                <div class="field">
                    <label for="">Email</label>
                    <input type="email" name="email" id="registerEmail" placeholder="example@email.com" />
                </div>

                <div class="field">
                    <label for="">Password</label>
                    <input type="password" name="password" id="registerPassword" placeholder="password" />
                </div>

                <div class="checkbox-row">
                    <label for="">Remember Me</label>
                    <input type="checkbox" name="remember-me" id="">
                </div>

                <div class="button-wrapper">
                    <button class="register-btn" type="submit">Sign Up</button>
                </div>

                <!--=====continue with Google=====-->
            </div>

        </div>
    </div>

    <script src="./js/auth.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
